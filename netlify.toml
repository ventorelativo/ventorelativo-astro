# Ventorelativo — Astro build.
# Cache rules ported from the Drupal repo's netlify.toml; see MIGRATION-PLAN.md §1.2 (S14).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # Netlify treats every environment variable as a secret and fails the build if
  # it finds one in the output. Astro's `PUBLIC_` prefix means the opposite: the
  # value is compiled into pages and sent to every visitor, so finding it in the
  # output is the point, not a leak.
  #
  #  - PUBLIC_KEYSTATIC_GITHUB_APP_SLUG is the GitHub App's URL name — the same
  #    string as this repository, and readable at github.com/apps/<slug>.
  #  - PUBLIC_CF_BEACON_TOKEN identifies the site to Cloudflare's analytics; it
  #    is written into a script tag on every page.
  #  - PUBLIC_MAPTILER_KEY and PUBLIC_TRACESTRACK_KEY sign every tile request
  #    the map makes from the browser, so they cannot be anything but public.
  #    They are protected by each provider's referrer allowlist instead — see
  #    src/lib/mapConfig.ts.
  #
  # Listed by name rather than disabling the scan, so a real secret added later
  # is still caught. The genuine ones — KEYSTATIC_GITHUB_CLIENT_SECRET and
  # KEYSTATIC_SECRET — carry no prefix and stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_KEYSTATIC_GITHUB_APP_SLUG,PUBLIC_CF_BEACON_TOKEN,PUBLIC_MAPTILER_KEY,PUBLIC_TRACESTRACK_KEY"

# Redirects (MIGRATION-PLAN.md S10, S11).
#
# These live here rather than in astro.config's `redirects` option: without a
# host adapter Astro emits meta-refresh HTML pages instead of real 301s, and a
# client-side hop passes no ranking signal. Netlify handles them at the edge.

# The one redirect entity in the Drupal site (S10).
[[redirects]]
  from = "/contact/contatti"
  to = "/contatti"
  status = 301
  force = true


# /home and / served identical content in Drupal — duplicate content (S11).
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# A memorable way in to the CMS. Keystatic hardcodes its own path — the UI
# derives its base path from the route it is mounted at, and its client calls
# /api/keystatic directly — so the app stays where the library puts it and this
# is a doorway to it, not a move. Starts working in Phase 3, when the admin is
# part of the deployed site; until then both sides of this 404.
[[redirects]]
  from = "/admin"
  to = "/keystatic"
  status = 301
  force = true

# The old site served its sitemap at /sitemap.xml; @astrojs/sitemap writes an
# index plus numbered parts. Anything that already knows the old URL — Search
# Console, a crawler's memory — is sent to the index (S8).
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Astro fingerprints everything under /_astro/ with a content hash, so those URLs
# change whenever the contents do — safe to cache forever. HTML is deliberately
# left on Netlify's revalidate-always default so content updates go live at once.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The contour pattern behind the footer and the site cards. Not hashed — it is
# served from public/ so the CSS can name it — so it is versioned by hand:
# change the drawing, change the filename.
[[headers]]
  for = "/topo.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Flight-computer data. Small, and pilots should get the current file.
#
# Content-Type is set explicitly because `.cup` is not an extension any server
# recognises, so it would otherwise be served as a binary blob. Drupal sent
# these as text/plain, and that is what the instruments and the browsers that
# preview them have always seen.
[[headers]]
  for = "/api/navdata/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/plain; charset=UTF-8"
